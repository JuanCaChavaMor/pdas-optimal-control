; cashocs 1.3 configuration for scripts/run_cashocs.py (algorithm and tolerances are passed in the script)

[StateSystem]
is_linear = True

[OptimizationRoutine]
algorithm = pdas
maximum_iterations = 100
rtol = 1e-9
atol = 0.0
initial_stepsize = 1.0
epsilon_armijo = 1e-4
beta_armijo = 2
soft_exit = True

[AlgoTNM]
inner_newton = cr
max_it_inner_newton = 100
inner_newton_tolerance = 1e-10

[AlgoPDAS]
inner_pdas = newton
maximum_iterations_inner_pdas = 100
pdas_regularization_parameter = 1e-4
pdas_inner_tolerance = 1e-2

[Output]
verbose = False
save_results = False
save_pvd = False
